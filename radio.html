<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141110" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Band — Pakistan &amp; India Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141110;
  --panel:#1F1A17;
  --panel-2:#2A231E;
  --rule:#3A312B;
  --dim:#9A8C80;
  --text:#F0E7DE;
  --glow:#F5C25B;
  --pk:#35A47B;
  --in:#E0642F;
  --bad:#E1523F;
  --ok:#35A47B;
  --wait:#C9A227;

  --face: "Barlow Condensed", "Oswald", Impact, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --accent: var(--pk);
  --pad: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.4;
  padding-bottom:calc(112px + var(--safe-b));
  overscroll-behavior-y:contain;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:6px}

/* ---------- Dial strip (signature) ---------- */
.dial{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#241D19 0%, #191412 100%);
  border-bottom:1px solid var(--rule);
  padding:10px var(--pad) 0;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.dial-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{
  font-family:var(--face);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:19px;color:var(--glow);
}
.brand small{display:block;font-size:10px;letter-spacing:.24em;color:var(--dim);font-weight:500}
.onair{
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;
}
.bars{display:flex;align-items:flex-end;gap:2px;height:13px}
.bars i{display:block;width:3px;height:3px;background:var(--rule);border-radius:1px}
.playing .bars i{background:var(--glow);animation:eq .9s ease-in-out infinite}
.playing .onair{color:var(--glow)}
.bars i:nth-child(2){animation-delay:.15s}
.bars i:nth-child(3){animation-delay:.3s}
.bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}

.window{
  margin-top:8px;background:#100D0C;border:1px solid var(--rule);
  border-radius:8px;padding:9px 12px 4px;
  box-shadow:inset 0 0 24px rgba(245,194,91,.07);
}
.nowline{display:flex;align-items:baseline;gap:10px;min-height:28px}
.nowname{
  font-family:var(--face);font-weight:600;font-size:23px;letter-spacing:.02em;
  color:var(--glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  text-shadow:0 0 18px rgba(245,194,91,.3);
}
.nowfreq{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}

/* scale */
.scale{position:relative;height:34px;margin-top:2px}
.ticks{
  position:absolute;inset:auto 0 12px;height:11px;
  background-image:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 5%);
}
.ticks::after{
  content:"";position:absolute;inset:auto 0 0;height:5px;
  background-image:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 1%);
  opacity:.5;
}
.nums{
  position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9px;color:#6B5C51;
}
.needle{
  position:absolute;top:0;bottom:10px;width:2px;background:var(--glow);
  box-shadow:0 0 10px 1px rgba(245,194,91,.6);border-radius:2px;
  transform:translateX(-1px);transition:left .5s cubic-bezier(.22,1,.36,1);
}
.needle::before{
  content:"";position:absolute;top:-3px;left:-4px;width:10px;height:6px;
  background:var(--glow);border-radius:2px;
}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;padding:12px var(--pad) 0;background:var(--ink)}
.tab{
  flex:1;min-height:48px;border:1px solid var(--rule);border-radius:8px;
  background:var(--panel);color:var(--dim);
  font-family:var(--face);font-weight:600;font-size:16px;letter-spacing:.1em;
  text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab[aria-selected="true"]{color:var(--ink);background:var(--tabc);border-color:var(--tabc)}
.tab .cnt{font-family:var(--mono);font-size:10px;letter-spacing:0;opacity:.75}
#tab-pk{--tabc:var(--pk)} #tab-in{--tabc:var(--in)} #tab-fav{--tabc:var(--glow)}

/* ---------- Toolbar ---------- */
.tools{padding:12px var(--pad) 4px;display:flex;flex-direction:column;gap:8px}
.search{
  width:100%;min-height:46px;border-radius:8px;border:1px solid var(--rule);
  background:var(--panel);padding:0 14px;color:var(--text);
}
.search::placeholder{color:#6B5C51}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  flex:1 1 auto;min-height:46px;padding:0 14px;border-radius:8px;
  border:1px solid var(--rule);background:var(--panel);color:var(--text);
  font-family:var(--face);font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
}
.btn:active{background:var(--panel-2)}
.btn[disabled]{opacity:.45}
.btn.key{background:var(--accent);border-color:var(--accent);color:#12100E}
.pill{
  display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;
  border-radius:999px;border:1px solid var(--rule);background:var(--panel);
  font-family:var(--mono);font-size:11px;color:var(--dim);
}
.pill[aria-pressed="true"]{color:var(--glow);border-color:#5A4A33}
.status{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  padding:2px var(--pad) 0;min-height:18px;
}
.status b{color:var(--glow);font-weight:400}

/* ---------- List ---------- */
.list{padding:8px var(--pad) 0;display:flex;flex-direction:column;gap:6px}
.row{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:11px 10px;min-height:64px;
}
.row.on{border-color:var(--accent);background:linear-gradient(90deg,rgba(255,255,255,.05),var(--panel))}
.led{width:9px;height:9px;border-radius:50%;background:#4A3F37;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.led.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.led.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.led.testing{background:var(--wait);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.meta{flex:1;min-width:0}
.nm{
  font-family:var(--face);font-weight:600;font-size:19px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sub .warn{color:var(--bad)}
.act{width:42px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid transparent}
.act:active{background:var(--panel-2)}
.star{font-size:20px;color:#5B4E44;line-height:1}
.star.on{color:var(--glow)}
.fix{border-color:var(--bad);color:var(--bad);font-family:var(--face);font-size:12px;letter-spacing:.06em;font-weight:600;width:auto;padding:0 8px}
.del{border-color:var(--bad);color:var(--bad);font-size:22px;line-height:1}
.del:active{background:rgba(225,82,63,.15)}

.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty h3{font-family:var(--face);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--text);margin:0 0 8px}
.empty p{margin:0 auto;max-width:34ch;font-size:14px}
.empty .btn{margin:16px auto 0;flex:0 0 auto;max-width:240px}

/* ---------- Player ---------- */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(26,21,19,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);
  padding:10px var(--pad) calc(10px + var(--safe-b));
  display:flex;align-items:center;gap:12px;
}
.ptxt{flex:1;min-width:0}
.ptxt .nm{font-size:17px}
.ptxt .sub{margin-top:2px}
.pbtn{
  width:60px;height:60px;border-radius:50%;flex:none;
  background:var(--accent);color:#12100E;display:flex;align-items:center;justify-content:center;
}
.pbtn svg{width:26px;height:26px}
.skip{width:46px;height:46px;border-radius:50%;flex:none;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.vol{width:104px;flex:none;accent-color:var(--glow)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet-in{
  width:100%;background:var(--panel);border-radius:16px 16px 0 0;
  border-top:1px solid var(--rule);padding:18px var(--pad) calc(20px + var(--safe-b));
  display:flex;flex-direction:column;gap:12px;max-height:86vh;overflow:auto;
}
.sheet h2{font-family:var(--face);font-size:22px;letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--glow)}
.sheet label{font-family:var(--mono);font-size:11px;color:var(--dim);display:block;margin-bottom:5px}
.sheet input{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--rule);background:#151110;padding:0 12px}
.hint{font-size:13px;color:var(--dim);margin:0}

@media (min-width:720px){
  body{max-width:860px;margin:0 auto}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .nowname{font-size:28px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<header class="dial" id="dial">
  <div class="dial-head">
    <div class="brand">Band<small>Pakistan · India</small></div>
    <div class="onair"><span class="bars"><i></i><i></i><i></i><i></i></span><span id="airtext">Standby</span></div>
  </div>
  <div class="window">
    <div class="nowline">
      <div class="nowname" id="nowname">Pick a station</div>
      <div class="nowfreq" id="nowfreq">—</div>
    </div>
    <div class="scale">
      <div class="ticks"></div>
      <div class="needle" id="needle" style="left:6%"></div>

</header>

<nav class="tabs" role="tablist">

  <button class="tab" id="tab-in"  role="tab" aria-selected="false" data-tab="in">India <span class="cnt" id="cnt-in"></span></button>

</nav>

<div class="tools">
  <input class="search" id="search" type="search" placeholder="Search stations" autocomplete="off" />
  <div class="btnrow">
    <button class="btn key" id="btn-check">Check all</button>
    <button class="btn" id="btn-repair">Repair broken</button>
  </div>
  <div class="btnrow">
    <button class="btn" id="btn-find">Find channels</button>
    <button class="btn" id="btn-add">Add stream</button>
  </div>
  <div class="btnrow">
    <button class="pill" id="tg-https" aria-pressed="true">HTTPS only</button>
    <button class="pill" id="tg-workonly" aria-pressed="false">Hide dead</button>
    <button class="pill" id="btn-diag">Diagnose</button>
  </div>
  <div class="btnrow">
    <button class="pill" id="btn-rmdead">Remove dead</button>
    <button class="pill" id="btn-restore" style="display:none">Restore</button>
  </div>
</div>
<div class="status" id="status"></div>

<main class="list" id="list"></main>
<div id="empty"></div>

<div class="player" id="player">
  <button class="skip" id="prev" aria-label="Previous station">
    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M7 6h2v12H7zm3 6l8-6v12z"/></svg>
  </button>
  <button class="pbtn" id="play" aria-label="Play">
    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-stop" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>
  </button>
  <button class="skip" id="next" aria-label="Next station">
    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M15 6h2v12h-2zM6 18V6l8 6z"/></svg>
  </button>
  <div class="ptxt">
    <div class="nm" id="p-name">Nothing playing</div>
    <div class="sub" id="p-sub">Tap a station to start</div>
  </div>
  <input class="vol" id="vol" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h2 id="sheet-title">Add a stream</h2>
    <div>
      <label for="f-name">Station name</label>
      <input id="f-name" placeholder="e.g. Hum FM 106.2" />
    </div>
    <div>
      <label for="f-url">Stream address</label>
      <input id="f-url" placeholder="https://… .mp3, .aac or .m3u8" inputmode="url" />
    </div>
    <div>
      <label for="f-country">Tab</label>
      <select id="f-country" class="search" style="min-height:48px">
        <option value="pk">Pakistan</option>
        <option value="in">India</option>
      </select>
    </div>
    <p class="hint" id="sheet-hint">The address is tested before it is saved.</p>
    <div class="btnrow">
      <button class="btn" id="f-cancel">Cancel</button>
      <button class="btn key" id="f-save">Test and save</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Storage — artifact key/value store, in-memory if unavailable
   ============================================================ */
const mem = {};
function hasLocal(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
}
const LOCAL = hasLocal();
const Store = {
  live(){ return LOCAL; },
  async get(k, fb){
    if(LOCAL){
      try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; }
    }
    return (k in mem) ? mem[k] : fb;
  },
  async set(k, v){
    mem[k] = v;
    if(!LOCAL) return;
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* quota or disabled */ }
  }
};
const K = { data:"band:data", fav:"band:favorites", health:"band:health", prefs:"band:prefs" };

/* ============================================================
   Radio Browser directory (open station database, CORS enabled)
   ============================================================ */
const MIRRORS = [
  "https://all.api.radio-browser.info",
  "https://de1.api.radio-browser.info",
  "https://de2.api.radio-browser.info",
  "https://fi1.api.radio-browser.info",
  "https://nl1.api.radio-browser.info"
];
let mirror = null;

async function api(path){
  const order = mirror ? [mirror, ...MIRRORS.filter(m=>m!==mirror)] : MIRRORS;
  for(const base of order){
    try{
      const ctl = new AbortController();
      const t = setTimeout(()=>ctl.abort(), 9000);
      const r = await fetch(base + path, { signal: ctl.signal, headers:{ "Accept":"application/json" } });
      clearTimeout(t);
      if(!r.ok) continue;
      const j = await r.json();
      mirror = base;
      return j;
    }catch(e){ /* try next mirror */ }
  }
  throw new Error("directory unreachable");
}

function countClick(uuid){
  if(!uuid || !mirror) return;
  fetch(mirror + "/json/url/" + encodeURIComponent(uuid)).catch(()=>{});
}

/* Stations the directory ranks lower but listeners actually ask for. */
const PINNED = {
  pk:["hum fm","fm 100","fm100","city fm","cityfm","suno","apna karachi","mast fm","power 99","radio pakistan","fm 101","samaa","hot fm","planet"],
  in:["mirchi","radio city","vividh bharati","air fm","fm gold","big fm","red fm","hungama","bollywood","radio nasha","rainbow","ishq"]
};

function norm(s){
  const t = (s.tags||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).join(" · ");
  return {
    id: s.stationuuid || ("u:"+(s.url_resolved||s.url)),
    uuid: s.stationuuid || "",
    name: (s.name||"Unnamed").replace(/\s+/g," ").trim(),
    url: (s.url_resolved || s.url || "").trim(),
    origin: (s.url||"").trim(),
    tags: t,
    codec: s.codec || "",
    bitrate: s.bitrate || 0,
    votes: s.votes || 0,
    home: s.homepage || "",
    custom: false
  };
}

function dedupe(arr){
  const seen = new Set(), out = [];
  for(const s of arr){
    const key = s.url.replace(/^https?:\/\//,"").replace(/\/+$/,"").toLowerCase();
    if(!s.url || seen.has(key)) continue;
    seen.add(key); out.push(s);
  }
  return out;
}

function rank(list, tab){
  const pins = PINNED[tab] || [];
  return list.map(s=>{
    const low = s.name.toLowerCase();
    const hit = pins.findIndex(p=>low.includes(p));
    return { s, score: (hit>=0 ? 10000 - hit*100 : 0) + Math.min(s.votes,4000)/10 };
  }).sort((a,b)=>b.score-a.score).map(x=>x.s);
}

async function fetchPakistan(){
  const q = "/json/stations/search?countrycode=PK&hidebroken=true&order=clickcount&reverse=true&limit=150";
  return rank(dedupe((await api(q)).map(norm)), "pk");
}

async function fetchIndiaHindi(){
  const qs = [
    "/json/stations/search?countrycode=IN&language=hindi&hidebroken=true&order=clickcount&reverse=true&limit=120",
    "/json/stations/search?countrycode=IN&tag=hindi&hidebroken=true&order=clickcount&reverse=true&limit=80",
    "/json/stations/search?countrycode=IN&tag=bollywood&hidebroken=true&order=clickcount&reverse=true&limit=80"
  ];
  const all = [];
  for(const q of qs){
    try{ all.push(...(await api(q)).map(norm)); }catch(e){}
  }
  if(!all.length) throw new Error("no results");
  return rank(dedupe(all), "in");
}

/* ============================================================
   Stream tester — the only reliable cross-origin probe is
   asking a real <audio> element to load it.
   ============================================================ */
function probe(url, timeout){
  timeout = timeout || 9000;
  return new Promise(resolve=>{
    if(!url) return resolve(false);
    if(location.protocol === "https:" && url.startsWith("http://")) return resolve(false);

    const a = new Audio();
    a.muted = true; a.volume = 0; a.preload = "auto";
    let done = false;
    const finish = ok => {
      if(done) return; done = true;
      clearTimeout(timer);
      try{ a.pause(); a.removeAttribute("src"); a.load(); }catch(e){}
      resolve(ok);
    };
    const timer = setTimeout(()=>finish(false), timeout);
    a.addEventListener("canplay", ()=>finish(true));
    a.addEventListener("loadeddata", ()=>finish(true));
    a.addEventListener("progress", ()=>{ if(a.buffered && a.buffered.length) finish(true); });
    a.addEventListener("error", ()=>finish(false));
    a.addEventListener("stalled", ()=>{});
    try{ a.src = url; a.load(); }catch(e){ finish(false); }
  });
}

async function probeMany(items, onEach, concurrency){
  concurrency = concurrency || 4;
  let i = 0;
  const workers = Array.from({length:Math.min(concurrency, items.length)}, async ()=>{
    while(i < items.length){
      const item = items[i++];
      const ok = await probe(item.url);
      await onEach(item, ok);
    }
  });
  await Promise.all(workers);
}

const S = {
  tab:"pk",
  data:{ pk:[], in:[] },
  custom:{ pk:[], in:[] },
  overrides:{},          // id -> repaired url
  removed:{},            // id -> true, stations the user deleted
  favorites:{},          // id -> station snapshot
  health:{},             // id -> "ok" | "bad" | "testing"
  prefs:{ httpsOnly:true, hideDead:false },
  current:null,
  playing:false,
  busy:false
};

const $ = s => document.querySelector(s);
const listEl = $("#list"), emptyEl = $("#empty"), statusEl = $("#status");

function say(msg){ statusEl.innerHTML = msg || ""; }

function tabStations(tab){
  if(tab === "fav") return Object.values(S.favorites);
  const base = (S.data[tab] || []).map(s => S.overrides[s.id] ? {...s, url:S.overrides[s.id]} : s);
  return [...(S.custom[tab] || []), ...base];
}

function visible(){
  let list = tabStations(S.tab).filter(s => !S.removed[s.id]);
  const q = ($("#search").value || "").trim().toLowerCase();
  if(q) list = list.filter(s => s.name.toLowerCase().includes(q) || (s.tags||"").toLowerCase().includes(q));
  if(S.prefs.httpsOnly) list = list.filter(s => !s.url.startsWith("http://"));
  if(S.prefs.hideDead) list = list.filter(s => S.health[s.id] !== "bad");
  return list.slice(0, 140);
}

/* Read a real frequency out of the station name when it has one. */
function freqOf(name){
  const m = (name||"").match(/(\d{2,3}(?:[.,]\d)?)\s*(?:mhz|fm)?/i);
  if(m){
    const v = parseFloat(m[1].replace(",", "."));
    if(v >= 87.5 && v <= 108) return v;
  }
  let h = 0;
  for(let i=0;i<(name||"").length;i++) h = (h*31 + name.charCodeAt(i)) % 1000;
  return 88 + (h/1000)*20;
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  const list = visible();
  document.body.style.setProperty("--accent", S.tab === "in" ? "var(--in)" : S.tab === "fav" ? "var(--glow)" : "var(--pk)");

  $("#cnt-pk").textContent  = S.data.pk.length ? S.data.pk.length + S.custom.pk.length : "";
  $("#cnt-in").textContent  = S.data.in.length ? S.data.in.length + S.custom.in.length : "";
  $("#cnt-fav").textContent = Object.keys(S.favorites).length || "";

  const gone = Object.keys(S.removed).length;
  const rb = $("#btn-restore");
  rb.style.display = gone ? "" : "none";
  rb.textContent = "Restore " + gone;

  listEl.innerHTML = "";
  if(!list.length){
    listEl.style.display = "none";
    emptyEl.innerHTML = emptyState();
    const b = emptyEl.querySelector("[data-act]");
    if(b) b.onclick = () => b.dataset.act === "find" ? loadTab(S.tab, true) : openSheet();
    return;
  }
  listEl.style.display = "";
  emptyEl.innerHTML = "";

  const frag = document.createDocumentFragment();
  for(const s of list){
    const row = document.createElement("div");
    row.className = "row" + (S.current && S.current.id === s.id ? " on" : "");
    const state = S.health[s.id] || "";
    const insecure = s.url.startsWith("http://");
    const bits = [];
    if(s.codec) bits.push(s.codec);
    if(s.bitrate) bits.push(s.bitrate + "k");
    if(s.tags) bits.push(s.tags);
    if(s.custom) bits.push("added by you");

    row.innerHTML = `
      <span class="led ${state}"></span>
      <div class="meta">
        <div class="nm"></div>
        <div class="sub">${insecure ? '<span class="warn">HTTP — blocked on secure pages</span> · ' : ""}${bits.join(" · ") || "live stream"}</div>
      </div>
      ${state === "bad" ? '<button class="act fix" data-fix>Fix</button>' : ""}
      <button class="act" data-fav aria-label="Save station"><span class="star ${S.favorites[s.id] ? "on" : ""}">★</span></button>
      <button class="act del" data-del aria-label="Delete station">&times;</button>
    `;
    row.querySelector(".nm").textContent = s.name;
    row.querySelector(".meta").onclick = () => playStation(s);
    row.querySelector(".led").onclick = async e => { e.stopPropagation(); await checkOne(s); };
    const fav = row.querySelector("[data-fav]");
    if(fav) fav.onclick = e => { e.stopPropagation(); toggleFav(s); };
    const del = row.querySelector("[data-del]");
    if(del) del.onclick = e => { e.stopPropagation(); deleteStation(s); };
    const fix = row.querySelector("[data-fix]");
    if(fix) fix.onclick = async e => { e.stopPropagation(); await repairOne(s, true); };
    frag.appendChild(row);
  }
  listEl.appendChild(frag);
}

function emptyState(){
  if(S.tab === "fav") return `<div class="empty"><h3>No saved stations</h3><p>Tap the star on any station and it lands here, ready for the drive.</p></div>`;
  if(S.busy) return `<div class="empty"><h3>Loading</h3><p>Pulling the current station list.</p></div>`;
  if($("#search").value.trim()) return `<div class="empty"><h3>Nothing matched</h3><p>Try a shorter word, or clear the search box.</p></div>`;
  return `<div class="empty"><h3>List is empty</h3><p>Pull a fresh list of ${S.tab === "pk" ? "Pakistani" : "Hindi"} stations, or enter a stream address yourself.</p><button class="btn key" data-act="find">Find channels</button></div>`;
}

/* ============================================================
   Playback
   ============================================================ */
const audio = new Audio();
audio.preload = "none";
audio.setAttribute("playsinline", "");
// Note: never set crossOrigin here. Almost no radio stream sends CORS
// headers, and requiring them makes every stream fail to load.
let hls = null;

function isHls(url){ return /\.m3u8(\?|$)/i.test(url); }

const MEDIA_ERR = {
  1:"Loading was cancelled.",
  2:"Network refused the stream — the server is down or unreachable.",
  3:"This browser cannot decode that audio format.",
  4:"Address rejected — dead link, offline server, or blocked by this page's security rules."
};

function lastError(){
  const e = audio.error;
  return e ? (MEDIA_ERR[e.code] || ("Player error " + e.code)) : "";
}

function envReport(){
  const framed = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
  return [
    location.protocol.replace(":",""),
    framed ? "running inside a frame" : "top-level window",
    navigator.onLine ? "online" : "offline"
  ].join(" · ");
}

/* Non-HLS streams must start in the same task as the tap, otherwise
   iOS treats it as autoplay and refuses. Do not await before play(). */
function startPlayback(url){
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  if(isHls(url) && !audio.canPlayType("application/vnd.apple.mpegurl")){
    return loadHlsJs().then(()=>{
      if(window.Hls && window.Hls.isSupported()){
        hls = new window.Hls({ enableWorker:true });
        hls.loadSource(url);
        hls.attachMedia(audio);
        return new Promise(r => setTimeout(r, 300)).then(()=>audio.play());
      }
      audio.src = url;
      return audio.play();
    });
  }
  audio.src = url;
  return audio.play();
}

function loadHlsJs(){
  if(window.Hls) return Promise.resolve();
  return new Promise(res=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js";
    s.onload = res; s.onerror = res;
    document.head.appendChild(s);
  });
}

async function playStation(s){
  S.current = s;
  paintNow(s, "Connecting");
  render();
  try{
    await startPlayback(s.url);
    S.playing = true;
    S.health[s.id] = "ok";
    saveHealth();
    paintNow(s, "On air");
    countClick(s.uuid);
    mediaSession(s);
    say("");
  }catch(e){
    S.playing = false;
    S.health[s.id] = "bad";
    saveHealth();
    paintNow(s, "Stream did not start");
    const why = lastError() || (e && e.name === "NotAllowedError"
      ? "The browser blocked playback — tap the play button directly."
      : (e && e.message) || "Unknown reason.");
    say(`<b>${escapeHtml(s.name)}</b> did not start. ${escapeHtml(why)} (${envReport()})`);
  }
  paintPlayer();
  render();
}

audio.addEventListener("playing", ()=>{ S.playing = true; paintPlayer(); document.getElementById("dial").classList.add("playing"); });
audio.addEventListener("pause",   ()=>{ S.playing = false; paintPlayer(); document.getElementById("dial").classList.remove("playing"); });
audio.addEventListener("error",   ()=>{
  if(!S.current) return;
  S.health[S.current.id] = "bad"; saveHealth(); render();
  paintNow(S.current, "Stream dropped");
  say(`<b>${escapeHtml(S.current.name)}</b> dropped out. Tap Fix on the row to find a replacement address.`);
});

function stop(){
  try{ audio.pause(); }catch(e){}
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  S.playing = false;
  paintPlayer();
}

function step(dir){
  const list = visible();
  if(!list.length) return;
  const i = S.current ? list.findIndex(x => x.id === S.current.id) : -1;
  const n = (i + dir + list.length) % list.length;
  playStation(list[n < 0 ? 0 : n]);
}

function paintNow(s, note){
  $("#nowname").textContent = s ? s.name : "Pick a station";
  const f = s ? freqOf(s.name) : null;
  $("#nowfreq").textContent = f ? f.toFixed(1) + " FM" : "—";
  $("#needle").style.left = (f ? ((f - 88) / 20) * 100 : 6) + "%";
  $("#airtext").textContent = note || "Standby";
}

function paintPlayer(){
  $("#icon-play").style.display = S.playing ? "none" : "";
  $("#icon-stop").style.display = S.playing ? "" : "none";
  $("#play").setAttribute("aria-label", S.playing ? "Stop" : "Play");
  $("#p-name").textContent = S.current ? S.current.name : "Nothing playing";
  $("#p-sub").textContent  = S.current ? (S.playing ? "Live" : "Paused") : "Tap a station to start";
  document.getElementById("dial").classList.toggle("playing", S.playing);
}

function mediaSession(s){
  if(!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.name,
    artist: S.tab === "in" ? "India · Live radio" : "Pakistan · Live radio",
    album: "Band"
  });
  navigator.mediaSession.setActionHandler("play", ()=>audio.play());
  navigator.mediaSession.setActionHandler("pause", ()=>stop());
  navigator.mediaSession.setActionHandler("stop", ()=>stop());
  navigator.mediaSession.setActionHandler("previoustrack", ()=>step(-1));
  navigator.mediaSession.setActionHandler("nexttrack", ()=>step(1));
}

/* ============================================================
   Check and repair
   ============================================================ */
async function checkOne(s){
  S.health[s.id] = "testing"; render();
  const ok = await probe(s.url);
  S.health[s.id] = ok ? "ok" : "bad";
  saveHealth(); render();
  say(ok ? `<b>${escapeHtml(s.name)}</b> is live.` : `<b>${escapeHtml(s.name)}</b> is down. Tap Fix to search for another address.`);
}

async function checkAll(){
  if(S.busy) return;
  S.busy = true; setBusy(true);
  const list = visible();
  if(S.playing) stop();
  let done = 0, good = 0;
  list.forEach(s => S.health[s.id] = "testing");
  render();
  await probeMany(list, async (s, ok)=>{
    S.health[s.id] = ok ? "ok" : "bad";
    done++; if(ok) good++;
    say(`Checked <b>${done}</b> of ${list.length} — ${good} live, ${done-good} down.`);
    if(done % 4 === 0) render();
  }, 4);
  saveHealth(); render();
  const dead = done - good;
  say(dead ? `${good} live, <b>${dead} down</b>. Tap Repair broken to hunt for replacements.` : `All ${good} stations are live.`);
  S.busy = false; setBusy(false);
}

/* Find a different working address for a station that has died. */
async function repairOne(s, verbose){
  S.health[s.id] = "testing"; render();
  if(verbose) say(`Looking for a working address for <b>${escapeHtml(s.name)}</b>…`);

  const tried = new Set([s.url]);
  const candidates = [];

  if(s.origin && s.origin !== s.url) candidates.push(s.origin);
  if(s.url.startsWith("http://")) candidates.push("https://" + s.url.slice(7));

  try{
    const q = "/json/stations/search?name=" + encodeURIComponent(cleanName(s.name)) +
              "&hidebroken=true&order=votes&reverse=true&limit=12";
    for(const c of (await api(q)).map(norm)){
      if(c.url) candidates.push(c.url);
      if(c.origin && c.origin !== c.url) candidates.push(c.origin);
    }
  }catch(e){}

  for(const url of candidates){
    if(tried.has(url)) continue;
    tried.add(url);
    if(location.protocol === "https:" && url.startsWith("http://")) continue;
    if(await probe(url, 7000)){
      S.overrides[s.id] = url;
      S.health[s.id] = "ok";
      if(S.favorites[s.id]) S.favorites[s.id] = {...S.favorites[s.id], url};
      const arr = S.custom[S.tab] || [];
      const ci = arr.findIndex(x => x.id === s.id);
      if(ci >= 0) arr[ci] = {...arr[ci], url};
      await saveAll(); render();
      if(verbose) say(`<b>${escapeHtml(s.name)}</b> repaired — new address saved.`);
      return true;
    }
  }
  S.health[s.id] = "bad"; saveHealth(); render();
  if(verbose) say(`No working address found for <b>${escapeHtml(s.name)}</b> right now. Try Find channels for a fresh list.`);
  return false;
}

function cleanName(n){
  return n.replace(/\d{2,3}([.,]\d)?/g,"").replace(/\b(fm|radio|live|online|hd|stream)\b/gi," ")
          .replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ") || n.slice(0,18);
}

async function repairAll(){
  if(S.busy) return;
  const broken = visible().filter(s => S.health[s.id] === "bad");
  if(!broken.length){ say("Nothing is marked as down. Run Check all first."); return; }
  S.busy = true; setBusy(true);
  if(S.playing) stop();
  let fixed = 0;
  for(let i=0;i<broken.length;i++){
    say(`Repairing ${i+1} of ${broken.length} — ${fixed} fixed so far.`);
    if(await repairOne(broken[i], false)) fixed++;
  }
  say(fixed ? `Repaired <b>${fixed}</b> of ${broken.length} stations.` : `None of the ${broken.length} broken stations had a working alternative.`);
  S.busy = false; setBusy(false);
}

function setBusy(b){
  ["btn-check","btn-repair","btn-find","btn-add"].forEach(id => $("#"+id).disabled = b);
}

/* ============================================================
   Lists, favorites, custom stations
   ============================================================ */
async function loadTab(tab, force){
  if(tab === "fav"){ render(); return; }
  if(!force && S.data[tab] && S.data[tab].length){ render(); return; }
  S.busy = true; render();
  say(`Fetching ${tab === "pk" ? "Pakistani" : "Hindi"} stations…`);
  try{
    const fresh = tab === "pk" ? await fetchPakistan() : await fetchIndiaHindi();
    S.data[tab] = dedupe([...seedStations(tab), ...S.custom[tab] ? [] : [], ...fresh]);
    await saveAll();
    say(`${S.data[tab].length} stations loaded. Run Check all to see which ones are live right now.`);
  }catch(e){
    S.data[tab] = seedStations(tab);
    say("Could not reach the online directory, so the built-in list is showing. If you are in a preview window, download the file and open it in your browser.");
  }
  S.busy = false; render();
}

function deleteStation(s){
  if(S.current && S.current.id === s.id) stop();

  if(S.tab === "fav"){
    delete S.favorites[s.id];
    say(`Removed <b>${escapeHtml(s.name)}</b> from Saved. It is still in its country tab.`);
  }else{
    S.removed[s.id] = true;
    delete S.favorites[s.id];
    if(s.custom){
      S.custom[S.tab] = (S.custom[S.tab] || []).filter(x => x.id !== s.id);
    }
    say(`Deleted <b>${escapeHtml(s.name)}</b>. Tap Restore to bring back everything you have deleted.`);
  }
  saveAll(); render();
}

function removeDead(){
  const dead = visible().filter(s => S.health[s.id] === "bad");
  if(!dead.length){ say("Nothing is marked as down. Run Check all first."); return; }
  dead.forEach(s=>{
    if(S.current && S.current.id === s.id) stop();
    if(S.tab === "fav") delete S.favorites[s.id];
    else { S.removed[s.id] = true; delete S.favorites[s.id]; }
    if(s.custom) S.custom[S.tab] = (S.custom[S.tab] || []).filter(x => x.id !== s.id);
  });
  saveAll(); render();
  say(`Removed <b>${dead.length}</b> dead station${dead.length>1?"s":""}.`);
}

function restoreRemoved(){
  const n = Object.keys(S.removed).length;
  if(!n){ say("Nothing has been deleted."); return; }
  S.removed = {};
  saveAll(); render();
  say(`Restored <b>${n}</b> station${n>1?"s":""}. Deleted custom streams cannot come back — add those again.`);
}

function toggleFav(s){
  if(S.favorites[s.id]) delete S.favorites[s.id];
  else S.favorites[s.id] = {...s, url: S.overrides[s.id] || s.url};
  saveAll(); render();
}

function openSheet(){ $("#sheet").classList.add("open"); $("#f-name").focus(); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#f-name").value = ""; $("#f-url").value = ""; $("#sheet-hint").textContent = "The address is tested before it is saved."; }

async function saveCustom(){
  const name = $("#f-name").value.trim();
  const url  = $("#f-url").value.trim();
  const tab  = $("#f-country").value;
  if(!name || !url){ $("#sheet-hint").textContent = "Enter both a name and a stream address."; return; }
  $("#sheet-hint").textContent = "Testing the address…";
  const ok = await probe(url, 10000);
  const st = { id:"custom:"+Date.now(), uuid:"", name, url, origin:url, tags:"", codec:"", bitrate:0, votes:0, home:"", custom:true };
  S.custom[tab] = S.custom[tab] || [];
  S.custom[tab].unshift(st);
  S.health[st.id] = ok ? "ok" : "bad";
  await saveAll();
  closeSheet();
  S.tab = tab; syncTabs(); render();
  say(ok ? `<b>${escapeHtml(name)}</b> saved and live.` : `<b>${escapeHtml(name)}</b> saved, but the address did not respond. Tap Fix to search for an alternative.`);
}

/* ============================================================
   Persistence
   ============================================================ */
let saveTimer = null;
function saveHealth(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>Store.set(K.health, S.health), 400);
}
async function saveAll(){
  await Store.set(K.data, { pk:S.data.pk, in:S.data.in, custom:S.custom, overrides:S.overrides, removed:S.removed, at:Date.now() });
  await Store.set(K.fav, S.favorites);
  await Store.set(K.health, S.health);
  await Store.set(K.prefs, S.prefs);
}

async function boot(){
  const d = await Store.get(K.data, null);
  if(d){
    S.data.pk = d.pk || []; S.data.in = d.in || [];
    S.custom = d.custom || { pk:[], in:[] };
    S.overrides = d.overrides || {};
    S.removed = d.removed || {};
  }
  S.favorites = await Store.get(K.fav, {});
  S.health    = await Store.get(K.health, {});
  S.prefs     = await Store.get(K.prefs, S.prefs);
  Object.keys(S.health).forEach(k => { if(S.health[k] === "testing") delete S.health[k]; });

  $("#tg-https").setAttribute("aria-pressed", String(!!S.prefs.httpsOnly));
  $("#tg-workonly").setAttribute("aria-pressed", String(!!S.prefs.hideDead));

  if(/iPad|iPhone|iPod/.test(navigator.userAgent)) $("#vol").style.display = "none";

  if(!S.data.pk.length) S.data.pk = seedStations("pk");
  if(!S.data.in.length) S.data.in = seedStations("in");

  render();
  paintPlayer();
  say("Built-in list loaded. Run Check all to see which stations are live right now.");

  // Quietly top up from the online directory; the built-in list stands if it fails.
  try{
    const fresh = await fetchPakistan();
    if(fresh.length) S.data.pk = dedupe([...seedStations("pk"), ...fresh]);
  }catch(e){}
  try{
    const fresh = await fetchIndiaHindi();
    if(fresh.length) S.data.in = dedupe([...seedStations("in"), ...fresh]);
  }catch(e){}
  await saveAll();
  render();
  if(!Store.live()) say("Saved stations will not survive a reload here — storage is switched off in this window.");
}

/* ============================================================
   Wiring
   ============================================================ */
function syncTabs(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = () => { S.tab = t.dataset.tab; syncTabs(); say(""); loadTab(S.tab, false); render(); };
});
$("#search").addEventListener("input", render);
$("#btn-check").onclick  = checkAll;
$("#btn-repair").onclick = repairAll;
$("#btn-find").onclick   = () => loadTab(S.tab === "fav" ? "pk" : S.tab, true);
$("#btn-add").onclick    = openSheet;
$("#f-cancel").onclick   = closeSheet;
$("#f-save").onclick     = saveCustom;
$("#sheet").onclick      = e => { if(e.target.id === "sheet") closeSheet(); };
$("#play").onclick = () => {
  if(S.playing) stop();
  else if(S.current) playStation(S.current);
  else { const l = visible(); if(l.length) playStation(l[0]); }
};
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#vol").oninput  = e => { audio.volume = parseFloat(e.target.value); };
$("#tg-https").onclick = e => {
  S.prefs.httpsOnly = !S.prefs.httpsOnly;
  e.currentTarget.setAttribute("aria-pressed", String(S.prefs.httpsOnly));
  Store.set(K.prefs, S.prefs); render();
};
$("#btn-rmdead").onclick  = removeDead;
$("#btn-restore").onclick = restoreRemoved;

$("#tg-workonly").onclick = e => {
  S.prefs.hideDead = !S.prefs.hideDead;
  e.currentTarget.setAttribute("aria-pressed", String(S.prefs.hideDead));
  Store.set(K.prefs, S.prefs); render();
};

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("#btn-diag").onclick = async () => {
  const lines = ["Page: " + envReport()];
  lines.push("Saving: " + (Store.live() ? "working" : "switched off"));
  say("Running checks…");

  try{ await api("/json/stats"); lines.push("Online directory: reachable"); }
  catch(e){ lines.push("Online directory: BLOCKED — built-in list only"); }

  const sample = visible()[0];
  if(sample){
    const ok = await probe(sample.url, 8000);
    lines.push("Test stream (" + sample.name + "): " + (ok ? "loads fine" : "will not load"));
  }
  if(audio.error) lines.push("Last player error: " + lastError());
  lines.push(lines.some(l=>l.includes("BLOCKED")||l.includes("will not load"))
    ? "→ If this page sits inside a preview or frame, outside audio is blocked. Download the file and open it in Safari or Chrome."
    : "→ Environment looks healthy. Any failures are individual dead stations — use Repair broken.");
  say(lines.map(escapeHtml).join("<br>"));
};

boot();
</script>
</body>
